
name: Build Addya GPTV APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/addya-gptv.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      # The NDK glslc cannot compile the upstream Vulkan cooperative matrix shaders.
      # Build the CPU backend for the first Android APK; RPC and cloud remain enabled.
      - name: Disable incompatible Vulkan shaders for test APK
        run: |
          sed -i 's/option(LLAMA_ANDROID_VULKAN "Build the Vulkan GPU backend" ON)/option(LLAMA_ANDROID_VULKAN "Build the Vulkan GPU backend" OFF)/' local_plugins/llama_flutter_android/android/CMakeLists.txt
          grep -F 'option(LLAMA_ANDROID_VULKAN "Build the Vulkan GPU backend" OFF)' local_plugins/llama_flutter_android/android/CMakeLists.txt

      - name: Change app name
        run: |
          sed -i 's/android:label="PrivateLM"/android:label="Addya GPTV"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        env:
          PRIVATELM_ALLOW_DEBUG_RELEASE_SIGNING: 'true'
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Addya-GPTV-APK
          path: build/app/outputs/flutter-apk/app-release.apk
# Addya GPTV Android Build
